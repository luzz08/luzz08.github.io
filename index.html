        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
const provider = new GithubAuthProvider();

document.getElementById('LOGINgit').addEventListener('click', () => {
  signInWithPopup(auth, provider)
    .then((result) => {
      console.log("Успешный вход:", result.user.displayName);
    })
    .catch((error) => {
      console.error("Ошибка входа:", error.code, error.message);
    });
});
const googleProvider = new GoogleAuthProvider();
document.getElementById('LOGINgoogle').addEventListener('click', () => {
    signInWithPopup(auth, googleProvider)
        .then((result) => {
            console.log("Google вход:", result.user.displayName, result.user.email);
        })
        .catch((error) => {
            console.error("Google ошибка:", error.code, error.message);
        });
});
        const analytics = getAnalytics(app);
