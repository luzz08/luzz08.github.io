<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Сайт</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; background: #f5f5f5; }
        .card { background: white; padding: 20px; max-width: 400px; margin: auto; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
        h1 { color: #333; font-size: 24px; margin: 15px 0 10px; }
        p { color: #666; font-size: 16px; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Картинка (можно заменить на свою, например src="photo.jpg") -->
        <img src="https://picsum.photos" alt="Изображение">
        
        <h1>Добро пожаловать!</h1>
        <p>Это пример очень короткого сайта. Здесь вы можете разместить информацию о себе, своем проекте или услугах.</p>
    </div>

</body>
</html>
