<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <table class="tablica" style="height:50vh" border="1">
        <tr>
            <td class="left" style="width:20vw">
                <ul>
                    <li><a href="index.html">Авторизация</a></li>
                    <li><a href="table.html">Таблица</a></li>
                    <li><a href="bootstrap.html">bootstrap</a></li>
                    <li><a href="flutter.html">flutter</a></li>
                    <li><a href="flex.html">flex</a></li>
                </ul>
            </td>

            <td class="content" style="width:80vw">
                <div class="content-1">
                    <h1>Авторизуйтесь</h1>

                    <div class="card">
                        <!-- Область входа: видна только когда не авторизован -->
                        <div id="login-area">
                            <button id="LOGINgit">Sign In GitHub</button>
                            <button id="LOGINgoogle">Sign In Google</button>
                        </div>
                    
                        <!-- Область пользователя: видна только когда авторизован -->
                        <div id="user-area" style="display: none;">
                            <p>Вы вошли как: <strong id="user-name"></strong></p>
                            <button id="LOGOUTbtn">Выйти</button>
                        </div>
                    </div>
                </div>
            </td>
        </tr>
    </table>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getAuth, signInWithPopup, GithubAuthProvider, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
    
        const firebaseConfig = {
          apiKey: "AIzaSyDLobcX1w4HeIvIMzme37KpCKUVEPQ6ajE",
          authDomain: "sitemdk-7beab.firebaseapp.com",
          projectId: "sitemdk-7beab",
          storageBucket: "sitemdk-7beab.firebasestorage.app",
          messagingSenderId: "1087058702653",
          appId: "1:1087058702653:web:f6bd098955c7f30f1f1554",
          measurementId: "G-808LYD3455"
        };
    
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
    
        // GitHub вход
        const githubProvider = new GithubAuthProvider();
        document.getElementById('LOGINgit').addEventListener('click', () => {
            signInWithPopup(auth, githubProvider)
                .then((result) => console.log("GitHub вход:", result.user.displayName))
                .catch((error) => console.error("GitHub ошибка:", error.code, error.message));
        });
    
        // Google вход
        const googleProvider = new GoogleAuthProvider();
        document.getElementById('LOGINgoogle').addEventListener('click', () => {
            signInWithPopup(auth, googleProvider)
                .then((result) => console.log("Google вход:", result.user.displayName, result.user.email))
                .catch((error) => console.error("Google ошибка:", error.code, error.message));
        });
    
        // Выход
        document.getElementById('LOGOUTbtn').addEventListener('click', () => {
            signOut(auth)
                .then(() => console.log("Вы вышли из аккаунта"))
                .catch((error) => console.error("Ошибка выхода:", error));
        });
    
        // Отслеживание состояния входа — управление отображением интерфейса
        onAuthStateChanged(auth, (user) => {
            const loginArea = document.getElementById('login-area');
            const userArea = document.getElementById('user-area');
            const userName = document.getElementById('user-name');
    
            if (user) {
                // Авторизован: показать информацию о пользователе и кнопку выхода, скрыть кнопки входа
                loginArea.style.display = 'none';
                userArea.style.display = 'block';
                userName.textContent = user.displayName || user.email || 'Пользователь';
            } else {
                // Не авторизован: показать кнопки входа, скрыть область пользователя
                loginArea.style.display = 'block';
                userArea.style.display = 'none';
            }
        });
    </script>
      
    <script src="script.js"></script>

</body>
</html>
